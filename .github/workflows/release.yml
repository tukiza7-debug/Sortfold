name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # B-19: GitHub injects EMPTY STRINGS (not null) for missing secrets.
          # Fail loudly here instead of with a cryptic keystore error later —
          # and never let a release fall back to a different key.
          missing=0
          for v in KEYSTORE_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Release secret $v is empty or unset. Every Sortfold release must be signed with the SAME keystore; configure all four secrets."
              missing=1
            fi
          done
          exit $missing

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > sortfold-release.jks
          echo "KEYSTORE_FILE=sortfold-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APKs and AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # AGP 8.13+ cannot build an AAB and split APKs in one invocation
        # (resource shrinking + ABI splits); the bundle gets its own pass with
        # -PbundleOnly which disables splits — the AAB handles ABIs natively.
        run: |
          ./gradlew bundleRelease -PbundleOnly --stacktrace \
            -PversionName=${{ steps.ver.outputs.version }} \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PgithubRepo=${{ github.repository }}
          ./gradlew assembleRelease --stacktrace \
            -PversionName=${{ steps.ver.outputs.version }} \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PgithubRepo=${{ github.repository }}

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            abi=""
            case "$base" in
              *arm64-v8a*) abi="arm64-v8a";;
              *armeabi-v7a*) abi="armeabi-v7a";;
              *x86_64*) abi="x86_64";;
              *universal*) abi="universal";;
            esac
            cp "$f" "dist/Sortfold-v${{ steps.ver.outputs.version }}-${abi}.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab \
             "dist/Sortfold-v${{ steps.ver.outputs.version }}.aab"
          ls -la dist

      - name: Generate short release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges "$PREV..${GITHUB_REF_NAME}" | head -5)
          else
            LOG=$(git log --oneline --no-merges -5)
          fi
          {
            echo "notes<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sortfold v${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/Sortfold-v*-arm64-v8a.apk
            dist/Sortfold-v*-armeabi-v7a.apk
            dist/Sortfold-v*-x86_64.apk
            dist/Sortfold-v*-universal.apk
            dist/Sortfold-v*.aab
          fail_on_unmatched_files: true
